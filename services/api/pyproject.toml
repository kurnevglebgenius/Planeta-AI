[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "planeta-api"
version = "0.1.0"
description = "Planeta AI FastAPI foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic-settings==2.10.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
